name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: openfhir-hapi-interceptor
          path: target/*.jar
          if-no-files-found: error

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Fork PRs cannot read repository secrets, so the license file could never be
    # written. Skip the job for them rather than failing red.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

    env:
      OPENFHIR_IMAGE_TAG: '3.0.0'

    steps:
      - uses: actions/checkout@v4

      - name: Check openFHIR license secret is available
        id: license
        env:
          OPENFHIR_LICENSE_JSON: ${{ secrets.OPENFHIR_LICENSE_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${OPENFHIR_LICENSE_JSON:-}" ]; then
            echo '::notice::OPENFHIR_LICENSE_JSON secret is not configured — skipping integration tests.'
            echo 'available=false' >> "$GITHUB_OUTPUT"
          else
            echo 'available=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Write openFHIR license
        if: ${{ steps.license.outputs.available == 'true' }}
        env:
          OPENFHIR_LICENSE_JSON: ${{ secrets.OPENFHIR_LICENSE_JSON }}
        run: |
          set -euo pipefail
          mkdir -p tests/licenses
          printf '%s' "$OPENFHIR_LICENSE_JSON" > tests/licenses/openfhir-license.json

      - name: Install newman
        if: ${{ steps.license.outputs.available == 'true' }}
        run: npm install -g newman

      - name: Run integration tests
        if: ${{ steps.license.outputs.available == 'true' }}
        run: ./tests/test.sh

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: |
            tests/newman-report.xml
            tests/docker-logs.txt
          if-no-files-found: ignore

      - name: Remove openFHIR license
        if: always()
        run: rm -f tests/licenses/openfhir-license.json
