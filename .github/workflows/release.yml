name: Release

# Cuts a release from main:
#   1. sets pom.xml to the release version
#   2. promotes the CHANGELOG.md "Unreleased" section to that version
#   3. commits and tags
#   4. builds the JAR and publishes a GitHub Release whose notes carry the
#      HAPI FHIR version this build targets plus the changelog for this version
#   5. bumps pom.xml to the next development version
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 2.0.0) — must not already be tagged'
        required: true
        type: string
      next_version:
        description: 'Next development version, without -SNAPSHOT (default: patch bump of the release version)'
        required: false
        type: string
      prerelease:
        description: 'Mark the GitHub release as a pre-release'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Build and print the notes, but do not tag, push or publish'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # Hard gate: nothing is tagged, pushed or published unless the end-to-end suite
  # passes. This runs for dry runs too — a dry run should tell you whether the real
  # release would pass. Unlike CI, a missing license secret fails rather than skips.
  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      OPENFHIR_IMAGE_TAG: '3.0.0'

    steps:
      - uses: actions/checkout@v4

      - name: Write openFHIR license
        env:
          OPENFHIR_LICENSE_JSON: ${{ secrets.OPENFHIR_LICENSE_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${OPENFHIR_LICENSE_JSON:-}" ]; then
            echo '::error::OPENFHIR_LICENSE_JSON secret is not configured — cannot run the integration suite, refusing to release untested.'
            exit 1
          fi
          mkdir -p tests/licenses
          printf '%s' "$OPENFHIR_LICENSE_JSON" > tests/licenses/openfhir-license.json

      - name: Install newman
        run: npm install -g newman

      - name: Run integration tests
        run: ./tests/test.sh

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: |
            tests/newman-report.xml
            tests/docker-logs.txt
          if-no-files-found: ignore

      - name: Remove openFHIR license
        if: always()
        run: rm -f tests/licenses/openfhir-license.json

  release:
    name: Release ${{ inputs.version }}
    runs-on: ubuntu-latest
    needs: integration

    steps:
      - uses: actions/checkout@v4
        with:
          # full history so the tag-to-tag commit log is available for the notes
          fetch-depth: 0

      - name: Validate version input
        run: |
          set -euo pipefail
          VERSION='${{ inputs.version }}'
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$VERSION' is not a valid semantic version (expected e.g. 2.0.0 or 2.0.0-rc1)"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "::error::Tag '$VERSION' already exists"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Configure git identity
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Set release version in pom.xml
        run: |
          set -euo pipefail
          mvn --batch-mode --no-transfer-progress \
            versions:set -DnewVersion='${{ inputs.version }}' -DgenerateBackupPoms=false

      - name: Read HAPI FHIR version from pom.xml
        id: hapi
        run: |
          set -euo pipefail
          HAPI_VERSION=$(mvn --batch-mode --no-transfer-progress -q \
            help:evaluate -Dexpression=hapi.fhir.version -DforceStdout)
          echo "Interceptor builds against HAPI FHIR $HAPI_VERSION"
          echo "version=$HAPI_VERSION" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Promote CHANGELOG Unreleased section
        id: changelog
        env:
          VERSION: ${{ inputs.version }}
          HAPI_VERSION: ${{ steps.hapi.outputs.version }}
        run: |
          set -euo pipefail
          python3 .github/scripts/release_changelog.py

      - name: Assemble release notes
        env:
          VERSION: ${{ inputs.version }}
          HAPI_VERSION: ${{ steps.hapi.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          PREV_TAG=$(git tag --list --sort=-v:refname | head -n 1 || true)

          {
            echo "## openFHIR HAPI Interceptor $VERSION"
            echo
            echo "**Built against HAPI FHIR \`$HAPI_VERSION\`.** This interceptor is loaded into a"
            echo "running HAPI FHIR server via its \`extra-classes\` mechanism, so it is supported on"
            echo "HAPI FHIR \`$HAPI_VERSION\` and other releases on that same line."
            echo
            echo "### Changes in this release"
            echo
            cat release-notes-changelog.md
            echo
            if [ -n "$PREV_TAG" ]; then
              echo "### Commits since $PREV_TAG"
              echo
              git log --no-merges --pretty=format:'- %s (%h)' "$PREV_TAG..HEAD"
              echo
              echo
              echo "**Full diff:** https://github.com/$REPO/compare/$PREV_TAG...$VERSION"
            fi
            echo
            echo "### Installation"
            echo
            echo 'Drop the attached `openfhir-hapi-interceptor-'"$VERSION"'.jar` into your HAPI FHIR'
            echo 'server'"'"'s `extra-classes` directory. See the [README](https://github.com/'"$REPO"'#how-to-use-it) for configuration.'
          } > release-notes.md

          echo "----- release notes -----"
          cat release-notes.md

      - name: Commit, tag and push
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          git add pom.xml CHANGELOG.md
          git commit -m 'Release ${{ inputs.version }}'
          git tag -a '${{ inputs.version }}' -m 'Release ${{ inputs.version }}'
          git push origin HEAD:${{ github.ref_name }}
          git push origin '${{ inputs.version }}'

      - name: Create GitHub release
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          body_path: release-notes.md
          prerelease: ${{ inputs.prerelease }}
          files: target/openfhir-hapi-interceptor-${{ inputs.version }}.jar
          fail_on_unmatched_files: true

      - name: Bump to next development version
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          NEXT='${{ inputs.next_version }}'
          if [ -z "$NEXT" ]; then
            NEXT=$(echo '${{ inputs.version }}' | awk -F. '{ sub(/-.*/, "", $3); printf "%s.%s.%d", $1, $2, $3 + 1 }')
          fi
          mvn --batch-mode --no-transfer-progress \
            versions:set -DnewVersion="$NEXT-SNAPSHOT" -DgenerateBackupPoms=false
          git add pom.xml
          git commit -m "Prepare for next development iteration ($NEXT-SNAPSHOT)"
          git push origin HEAD:${{ github.ref_name }}

      - name: Dry run summary
        if: ${{ inputs.dry_run }}
        run: |
          {
            echo '## Dry run — nothing was tagged, pushed or published'
            echo
            cat release-notes.md
          } >> "$GITHUB_STEP_SUMMARY"
