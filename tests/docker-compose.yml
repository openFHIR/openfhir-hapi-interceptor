services:
  hapi:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: hapi-test
    ports:
      - "4080:8080"
    volumes:
      - ./config/application.yml:/app/config/application.yml:ro
      - ./config/cdrs.yml:/etc/cdrs.yml:ro
    depends_on:
      hapi-postgres:
        condition: service_healthy

  openfhir:
    image: openfhir/openfhir-enterprise:${OPENFHIR_IMAGE_TAG:-3.0.0}
    container_name: openfhir-test
    ports:
      - "8080:8080"
    volumes:
      - ./fhirconnect:/app/bootstrap/
      - ./licenses/openfhir-license.json:/app/openfhir-license.json
    depends_on:
      - mongodb
    entrypoint: ["/bin/sh", "-c", "sleep 10 && exec java -jar app.jar"]
    environment:
      SPRING_DATA_MONGODB_URI: "mongodb://openfhir:openfhir@mongodb:27017/openfhir"
      OPENFHIR_DB_TYPE: "mongo"

  mongodb:
    image: mongo:7
    container_name: mongodb-test
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: "admin"
      MONGO_INITDB_ROOT_PASSWORD: "admin"
      MONGO_INITDB_DATABASE: "openfhir"
    volumes:
      - ./init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  hapi-postgres:
    image: postgres:16
    container_name: hapi-postgres-test
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  ehrbase-postgres:
    image: ehrbase/ehrbase-v2-postgres:16.2
    container_name: ehrbase-postgres-test
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      PASSWORD: postgres
      EHRBASE_USER: ehrbase_restricted
      EHRBASE_PASSWORD: ehrbase_restricted
      EHRBASE_USER_ADMIN: ehrbase
      EHRBASE_PASSWORD_ADMIN: ehrbase
    restart: unless-stopped

  ehrbase:
    image: ehrbase/ehrbase
    container_name: ehrbase-test
    ports:
      - "8081:8080"
    environment:
      DB_URL: jdbc:postgresql://ehrbase-postgres-test:5432/ehrbase
      DB_USER: ehrbase_restricted
      DB_PASS: ehrbase_restricted
      DB_USER_ADMIN: ehrbase
      DB_PASS_ADMIN: ehrbase
      SERVER_NODENAME: local.ehrbase.org
      SPRING_PROFILES_ACTIVE: local
    depends_on:
      - ehrbase-postgres
    restart: unless-stopped
