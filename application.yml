spring:
  datasource:
    url: jdbc:postgresql://db:5432/hapi
    username: hapi
    password: hapi
    driverClassName: org.postgresql.Driver
  jpa:
    properties:
      hibernate:
        dialect: ca.uhn.fhir.jpa.model.dialect.HapiFhirPostgres94Dialect
        search:
          enabled: false

hapi:
  fhir:
    fhir_version: R4
    server_address: http://localhost:8080/fhir
    custom_bean_packages: com.syntaric
    custom_interceptor_classes: >-
      com.syntaric.hapi.QedmSearchInterceptor,
      com.syntaric.hapi.IpsBundleInterceptor,
      com.syntaric.hapi.PatientInterceptor

openfhir:
#  base-url: http://openfhir-enterprise:8080
  base-url: https://sandbox.open-fhir.com
  oauth2:                          # uncomment to enable client_credentials for OpenFHIR
   token-url: https://sandbox.open-fhir.com/auth/realms/open-fhir/protocol/openid-connect/token
   client-id: ***REMOVED***
   client-secret: YOUR_SECRET_HERE

openehr:
  cdrs-config-file: /etc/openfhir/cdrs.yml
