server {
    listen 80;
    server_name ips.open-fhir.com;

    # ACME challenge for Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name ips.open-fhir.com;

    ssl_certificate     /etc/letsencrypt/live/ips.open-fhir.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ips.open-fhir.com/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Proxy FHIR requests directly to HAPI
    location /fhir {
        proxy_pass http://hapi:8080/fhir;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Accept, X-Req-Id, X-OpenEhrCdr, Authorization" always;
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type, Accept, X-Req-Id, X-OpenEhrCdr, Authorization";
            return 204;
        }
    }

    # Proxy config-server API
    location /api/ {
        proxy_pass http://config-server:3001;
        proxy_set_header Host $host;
    }

    # Dashboard SPA
    location / {
        proxy_pass http://dashboard:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
